<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">My<span>Shop</span></div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Categories</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="actions">
    <input type="text" placeholder="Search products...">
    <button>Cart (0)</button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Discover Amazing Products</h1>
    <p>Shop the latest collections with fast delivery and secure checkout.</p>
    <button>Shop Now</button>
  </div>
</section>

<section class="products">

  <h2>Featured Products</h2>

  <div class="grid">

    <div class="card">
      <img src="https://picsum.photos/300/300?1" alt="">
      <h3>Wireless Headphones</h3>
      <p>$99</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/300?2" alt="">
      <h3>Smart Watch</h3>
      <p>$149</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/300?3" alt="">
      <h3>Gaming Mouse</h3>
      <p>$59</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/300?4" alt="">
      <h3>Bluetooth Speaker</h3>
      <p>$89</p>
      <button>Add to Cart</button>
    </div>

  </div>

</section>

<footer>
  <p>© 2026 MyShop. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
