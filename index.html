<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRD Film</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#e50914;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

nav{
background:#000;
padding:15px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
}

.hero{
min-height:400px;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=80");
background-size:cover;
background-position:center;
text-align:center;
}

.hero h1{
font-size:42px;
line-height:1.2;
}

.hero p{
font-size:18px;
margin:15px 0;
}

.hero button{
padding:12px 30px;
font-size:18px;
background:#e50914;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

@media (max-width:768px){

.hero h1{
font-size:24px;
}

.hero p{
font-size:16px;
}

nav a{
font-size:16px;
}
}

.movies{
padding:30px;
}

.movies h2{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card h3{
padding:10px;
text-align:center;
}

footer{
margin-top:40px;
background:#000;
padding:20px;
text-align:center;
color:#aaa;
}
</style>

</head>

<body>

<header>KRD Film</header>

<nav>
<a href="#">سەرەکی</a>
<a href="#">فیلمەکان</a>
<a href="#">زنجیرەکان</a>
<a href="#">دەربارە</a>
</nav>
