<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRD Film</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Arabic',sans-serif;
scroll-behavior:smooth;
}

body{
background:#0d0d0d;
color:#fff;
overflow-x:hidden;
}

a{
text-decoration:none;
color:white;
}

img{
display:block;
width:100%;
}

header{
position:fixed;
top:0;
left:0;
right:0;
z-index:999;
background:rgba(0,0,0,.92);
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:34px;
font-weight:bold;
color:#e50914;
}

nav{
display:flex;
gap:25px;
align-items:center;
}

nav a{
font-size:17px;
transition:.3s;
}

nav a:hover{
color:#e50914;
}

.search{
width:240px;
padding:10px 15px;
border:none;
border-radius:30px;
background:#222;
color:white;
font-size:16px;
outline:none;
}

.hero{
margin-top:80px;
height:90vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:24px;
color:#ddd;
margin-bottom:35px;
}

.hero button{
background:#e50914;
color:white;
border:none;
padding:15px 45px;
font-size:20px;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.hero button:hover{
transform:scale(1.05);
background:#ff1d28;
}

.section{
padding:70px 40px;
}

.section h2{
font-size:34px;
margin-bottom:30px;
color:#fff;
}

.movies{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:#181818;
border-radius:12px;
overflow:hidden;
transition:.35s;
cursor:pointer;
}

.card:hover{
transform:translateY(-8px) scale(1.03);
box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.card h3{
padding:15px;
font-size:22px;
text-align:center;
}

.card p{
padding:0 15px 18px;
color:#bbb;
font-size:15px;
text-align:center;
}

footer{
background:#000;
padding:40px;
text-align:center;
color:#888;
margin-top:70px;
}

@media(max-width:768px){

header{
padding:15px;
flex-direction:column;
gap:15px;
}

.logo{
font-size:28px;
}

nav{
flex-wrap:wrap;
justify-content:center;
}

.search{
width:100%;
}

.hero h1{
font-size:34px;
}

.hero p{
font-size:18px;
}

.hero button{
font-size:18px;
padding:12px 30px;
}

.section{
padding:40px 20px;
}

}
</style>

<body>

<header>

<div class="logo">
KRD Film
</div>

<nav>
<a href="#">سەرەکی</a>
<a href="#">فیلمەکان</a>
<a href="#">زنجیرەکان</a>
<a href="#">کاتێگۆری</a>
<a href="#">دەربارە</a>
</nav>

<input
class="search"
type="text"
placeholder="گەڕان بۆ فیلم..."
>

</header>

<section class="hero">

<h1>بەخێربێیت بۆ KRD Film</h1>

<p>
باشترین شوێنی سەیرکردنی فیلم و زنجیرەکان
</p>

<button>
دەستپێبکە
</button>

</section>

<section class="section">

<h2>فیلمە نوێکان</h2>

<div class="movies">
