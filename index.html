<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRD Film</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#e50914;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
}

nav{
background:#000;
padding:15px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

nav a{
color:#fff;
text-decoration:none;
font-size:18px;
}

.search{
background:#111;
padding:20px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
outline:none;
}

.hero{
min-height:350px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=80");
background-size:cover;
background-position:center;
padding:20px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:20px;
margin:15px 0;
}

.hero button{
padding:12px 30px;
font-size:18px;
background:#e50914;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

.movies{
padding:30px;
}

.movies h2{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card h3{
padding:10px;
text-align:center;
}

footer{
background:#000;
padding:20px;
text-align:center;
margin-top:40px;
color:#aaa;
}

@media(max-width:768px){

.hero h1{
font-size:28px;
}

.hero p{
font-size:18px;
}

nav{
gap:12px;
}

}
</style>

</head>

<body>

<header>KRD Film</header>

<nav>
<a href="#">سەرەکی</a>
<a href="#">فیلمەکان</a>
<a href="#">زنجیرەکان</a>
<a href="#">دەربارە</a>
</nav>

<div class="search">
<input type="text" placeholder="گەڕان بۆ فیلم...">
</div>

<section class="hero">
<h1>بەخێربێیت بۆ KRD Film</h1>
<p>باشترین شوێنی سەیرکردنی فیلم و زنجیرەکان</p>
<button>دەستپێبکە</button>
</section>

<section class="movies">
<h2>فیلمە نوێکان</h2>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/300/450?1">
<h3>Film 1</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?2">
<h3>Film 2</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?3">
<h3>Film 3</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?4">
<h3>Film 4</h3>
</div>

</div>
</section>

<footer>
© 2026 KRD Film
</footer>

</body>
</html>
